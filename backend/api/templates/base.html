<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}KarateApp{% endblock %}</title>
    <style>
        :root {
            color-scheme: light dark;
            --background: #f6f7f9;
            --foreground: #1f2328;
            --muted: #65707c;
            --card: #ffffff;
            --border: #d8dee4;
            --accent: #9b111e;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #101214;
                --foreground: #f2f4f7;
                --muted: #aab2bd;
                --card: #191c20;
                --border: #343941;
                --accent: #ff6b78;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--foreground);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
        }

        .shell {
            width: min(1040px, calc(100% - 32px));
            margin: 0 auto;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            border-bottom: 1px solid var(--border);
            background: color-mix(in srgb, var(--background) 92%, transparent);
            backdrop-filter: blur(14px);
        }

        .topbar .shell {
            min-height: 72px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--foreground);
            text-decoration: none;
            font-weight: 760;
            font-size: 1.16rem;
        }

        .brand-icon {
            width: 42px;
            height: 42px;
            border-radius: 10px;
        }

        .nav {
            display: flex;
            align-items: center;
            gap: 18px;
            font-size: .95rem;
        }

        .nav a {
            color: var(--muted);
            text-decoration: none;
        }

        .nav a:hover,
        .nav a.active {
            color: var(--foreground);
        }

        main {
            flex: 1;
            padding: 54px 0 64px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2.4rem, 9vw, 4.4rem);
            line-height: 1;
            letter-spacing: 0;
        }

        .download-section {
            margin-top: 28px;
        }

        .download-section h2 {
            margin: 0 0 10px;
            font-size: 1rem;
            line-height: 1.2;
        }

        .mobile-downloads {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .download {
            min-height: 82px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            padding: 14px 16px;
            color: var(--foreground);
            text-decoration: none;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .download:hover {
            border-color: var(--accent);
        }

        .download span {
            font-size: 1rem;
            font-weight: 750;
        }

        .download small {
            color: var(--muted);
            font-size: .92rem;
        }

        .download.disabled {
            opacity: .58;
            pointer-events: none;
        }

        .desktop-panel {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        .desktop-downloads {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }

        .desktop-downloads .download {
            min-height: 70px;
            background: transparent;
        }

        .article {
            max-width: 860px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 26px;
        }

        .article h1 {
            font-size: 2rem;
            line-height: 1.2;
        }

        .article h2 {
            margin-top: 2rem;
            font-size: 1.25rem;
            line-height: 1.2;
        }

        .article p,
        .article li {
            color: var(--muted);
        }

        .article strong,
        .article a {
            color: var(--foreground);
        }

        .article a {
            text-decoration-color: var(--accent);
            text-underline-offset: 3px;
        }

        .article ul {
            padding-left: 1.3rem;
        }

        .meta {
            color: var(--muted);
            margin-bottom: 1.8rem;
        }

        footer {
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: .9rem;
        }

        footer .shell {
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
        }

        footer nav {
            display: flex;
            gap: 16px;
        }

        footer a {
            color: var(--muted);
            text-decoration-thickness: 1px;
            text-underline-offset: 3px;
        }

        @media (max-width: 520px) {
            .topbar .shell,
            footer .shell {
                align-items: flex-start;
                flex-direction: column;
                justify-content: center;
                padding: 12px 0;
            }

            .mobile-downloads,
            .desktop-downloads {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="topbar">
        <div class="shell">
            <a class="brand" href="/">
                <img class="brand-icon" src="/static/store/google-play-icon-512.png" alt="">
                <span>KarateApp</span>
            </a>
            <div class="nav">
                <a class="{{ 'active' if active_page == 'downloads' else '' }}" href="/">Downloads</a>
            </div>
        </div>
    </nav>

    <main class="shell">
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="shell">
            <span>KarateApp</span>
            <nav aria-label="Footer">
                <a href="/support">Support</a>
                <a href="/privacy">Datenschutz</a>
                <a href="/imprint">Impressum</a>
                <a href="https://github.com/trittsv/karate-app">GitHub</a>
            </nav>
        </div>
    </footer>
</body>
</html>
