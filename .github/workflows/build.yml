name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  QT_VERSION: "6.11.1"

jobs:
  android:
    name: Android
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Qt Android
        run: |
          echo "::add-mask::$QT_ARCHIVE_URL"
          curl -fL "$QT_ARCHIVE_URL" -o "$RUNNER_TEMP/$QT_VERSION.tar.gz"
          mkdir -p "$RUNNER_TEMP/Qt"
          tar -xzf "$RUNNER_TEMP/$QT_VERSION.tar.gz" -C "$RUNNER_TEMP/Qt"
          echo "QT_ROOT_DIR=$RUNNER_TEMP/Qt/$QT_VERSION/android_arm64_v8a" >> "$GITHUB_ENV"
          echo "QT_HOST_PATH=$RUNNER_TEMP/Qt/$QT_VERSION/macos" >> "$GITHUB_ENV"
        env:
          QT_ARCHIVE_URL: ${{ secrets.QT_ARCHIVE_URL }}

      - name: Configure Android
        run: |
          cmake -S . -B build-android \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_NDK="$ANDROID_NDK_HOME" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DQt6_DIR="$QT_ROOT_DIR/lib/cmake/Qt6" \
            -DQt6Concurrent_DIR="$QT_ROOT_DIR/lib/cmake/Qt6Concurrent" \
            -DQt6Core_DIR="$QT_ROOT_DIR/lib/cmake/Qt6Core" \
            -DQt6Gui_DIR="$QT_ROOT_DIR/lib/cmake/Qt6Gui" \
            -DQt6Location_DIR="$QT_ROOT_DIR/lib/cmake/Qt6Location" \
            -DQt6Network_DIR="$QT_ROOT_DIR/lib/cmake/Qt6Network" \
            -DQt6OpenGL_DIR="$QT_ROOT_DIR/lib/cmake/Qt6OpenGL" \
            -DQt6PdfQuick_DIR="$QT_ROOT_DIR/lib/cmake/Qt6PdfQuick" \
            -DQt6Pdf_DIR="$QT_ROOT_DIR/lib/cmake/Qt6Pdf" \
            -DQt6PositioningQuick_DIR="$QT_ROOT_DIR/lib/cmake/Qt6PositioningQuick " \
            -DQt6Positioning_DIR="$QT_ROOT_DIR/lib/cmake/Qt6Positioning" \
            -DQt6QmlAssetDownloaderPrivate_DIR="$QT_ROOT_DIR/lib/cmake/Qt6QmlAssetDownloaderPrivate" \
            -DQt6QmlIntegration_DIR="$QT_ROOT_DIR/lib/cmake/Qt6QmlIntegration" \
            -DQt6QmlMeta_DIR="$QT_ROOT_DIR/lib/cmake/Qt6QmlMeta" \
            -DQt6QmlModels_DIR="$QT_ROOT_DIR/lib/cmake/Qt6QmlModels" \
            -DQt6QmlWorkerScript_DIR="$QT_ROOT_DIR/lib/cmake/Qt6QmlWorkerScript" \
            -DQt6Qml_DIR="$QT_ROOT_DIR/lib/cmake/Qt6Qml" \
            -DQt6QuickControls2_DIR="$QT_ROOT_DIR/lib/cmake/Qt6QuickControls2" \
            -DQt6QuickShapes_DIR="$QT_ROOT_DIR/lib/cmake/Qt6QuickShapes" \
            -DQt6QuickTemplates2_DIR="$QT_ROOT_DIR/lib/cmake/Qt6QuickTemplates2" \
            -DQt6Quick_DIR="$QT_ROOT_DIR/lib/cmake/Qt6Quick" \
            -DQt6WebView_DIR="$QT_ROOT_DIR/lib/cmake/Qt6WebView" \
            -DQt6Widgets_DIR="$QT_ROOT_DIR/lib/cmake/Qt6Widgets" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
        env:
          THUNDERFOREST_API_KEY: ${{ secrets.THUNDERFOREST_API_KEY }}
          APP_STORE_ID: ${{ secrets.APP_STORE_ID }}
          GOOGLE_PLAY_APP_ID: ${{ secrets.GOOGLE_PLAY_APP_ID }}

      - name: Build
        run: cmake --build build-android --config Release --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            build-android/**/*.apk
            build-android/**/*.aab

